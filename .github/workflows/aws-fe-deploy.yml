name: AWS FE CD

# Deploys https://u-bot.cloud. The runner first checks the commit (lint, format, test, build);
# then SSM tells the FE EC2 to build the same commit itself and switch Nginx to it
# (scripts/deploy/aws-fe-release.sh). No build output leaves the runner, so no S3 is needed.
#
# Repository secrets:
#   AWS_FE_ROLE_ARN            OIDC role; this repository's OIDC subjects carry owner and repository IDs:
#                                repo:<org>@<owner id>/<repo>@<repo id>:ref:refs/heads/<branch>
#                              ssm:SendCommand on document/AWS-RunShellScript and the FE instance only,
#                              ssm:GetCommandInvocation
#   AWS_FE_INSTANCE_ID
# Server-only build settings (VITE_KAKAO_JAVASCRIPT_KEY) stay in /home/ssm-user/ubot-fe/.env.local
# on the FE EC2; the release script copies it into the build.
# Variables:
#   AWS_FE_DEPLOY_ENABLED      'true' turns deployment on; 'false' freezes the server
#   AWS_FE_COUNSEL_ENABLED     counseling screens (default false; follow the BE COUNSEL_ENABLED)

on:
  push:
    # chore/aws-fe-cicd is the test branch for this workflow. Remove it before merging.
    branches: [develop, chore/aws-fe-cicd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-fe-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  COUNSEL_ENABLED: ${{ vars.AWS_FE_COUNSEL_ENABLED || 'false' }}

jobs:
  verify:
    if: github.ref_name == 'develop' || github.ref_name == 'chore/aws-fe-cicd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, format and test
        run: |
          npm run lint
          npm run format:check
          npm test

      # Same build as the FE EC2 makes: served from / with the API on the same origin.
      - name: Build for u-bot.cloud
        env:
          VITE_API_BASE_URL: ''
          VITE_COUNSEL_ENABLED: ${{ env.COUNSEL_ENABLED }}
        run: |
          set -euo pipefail
          npm run build -- --base /
          grep -q 'src="/assets/' dist/index.html

  deploy:
    needs: [verify]
    if: vars.AWS_FE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      ROLE_ARN: ${{ secrets.AWS_FE_ROLE_ARN }}
      FE_INSTANCE_ID: ${{ secrets.AWS_FE_INSTANCE_ID }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment settings
        run: |
          set -euo pipefail
          test -n "$ROLE_ARN" || { echo 'Secret AWS_FE_ROLE_ARN is not set' >&2; exit 1; }
          test -n "$FE_INSTANCE_ID" || { echo 'Secret AWS_FE_INSTANCE_ID is not set' >&2; exit 1; }
          # Also validates the commit and flag before anything reaches AWS.
          bash scripts/deploy/aws-fe-ssm-command.sh "$RELEASE_SHA" "$COUNSEL_ENABLED" \
            > "$RUNNER_TEMP/ssm-parameters.json"

      - name: Assume FE CD role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # A slower run for an older commit must not replace a newer release.
      - name: Check the branch still points at this commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "$current_sha" = "$RELEASE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "Skipped stale commit ${RELEASE_SHA}; ${GITHUB_REF_NAME} is ${current_sha}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build and release on the FE EC2 through SSM
        if: steps.head.outputs.deploy == 'true'
        id: command
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$FE_INSTANCE_ID" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --timeout-seconds 120 \
            --comment "UBot FE ${RELEASE_SHA}" \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id (${GITHUB_REF_NAME}@${RELEASE_SHA})" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the release
        if: steps.command.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          set -euo pipefail
          for ((attempt = 1; attempt <= 120; attempt++)); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$FE_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              ''|Pending|InProgress|Delayed|Cancelling)
                sleep 10
                continue
                ;;
            esac
            # The server log is the only place release errors appear, so print it either way.
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$FE_INSTANCE_ID" \
              --query '[Status, ResponseCode, StandardOutputContent, StandardErrorContent]' --output text
            if [ "$status" = Success ]; then
              exit 0
            fi
            exit 1
          done
          echo "FE release did not finish within 20 minutes: $COMMAND_ID" >&2
          exit 1

      - name: Check the public site
        if: steps.command.outputs.command_id != ''
        run: |
          set -euo pipefail
          index="$(curl -fsS --max-time 10 https://u-bot.cloud/)"
          asset="$(printf '%s' "$index" | grep -o 'src="/assets/[^"]*"' | head -n 1 | cut -d '"' -f 2)"
          test -n "$asset"
          curl -fsS --max-time 10 -o /dev/null "https://u-bot.cloud$asset"
          echo "https://u-bot.cloud serves $asset" >> "$GITHUB_STEP_SUMMARY"
